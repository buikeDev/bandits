name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bandit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bandit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/bandit?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/bandit?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bandit/database db:generate
      - run: pnpm --filter @bandit/database db:migrate:deploy
      - run: pnpm --filter @bandit/database db:seed
      - run: pnpm --filter @bandit/database build
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm --filter @bandit/backend test
        env:
          RUN_DATABASE_TESTS: 'true'
          RUN_ORDER_DB_TEST: 'true'
          RUN_CATALOGUE_DB_TEST: 'true'
      - run: pnpm build
